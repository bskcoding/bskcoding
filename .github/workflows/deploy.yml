name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        env:
          GEMINI_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ VITE_GEMINI_API_KEY secret is not set"
            exit 1
          fi

          if [ -z "$EMAILJS_SERVICE_ID" ] || [ -z "$EMAILJS_TEMPLATE_ID" ] || [ -z "$EMAILJS_PUBLIC_KEY" ]; then
            echo "❌ EmailJS secrets are not set"
            exit 1
          fi

          echo "VITE_GEMINI_API_KEY=$GEMINI_KEY" > .env
          echo "VITE_EMAILJS_SERVICE_ID=$EMAILJS_SERVICE_ID" >> .env
          echo "VITE_EMAILJS_TEMPLATE_ID=$EMAILJS_TEMPLATE_ID" >> .env
          echo "VITE_EMAILJS_PUBLIC_KEY=$EMAILJS_PUBLIC_KEY" >> .env

      - name: Check Gemini secret
        env:
          GEMINI_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ Gemini secret is EMPTY"
            exit 1
          else
            echo "✅ Gemini secret is available"
          fi

      - name: Check EmailJS secrets
        env:
          EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          if [ -z "$EMAILJS_SERVICE_ID" ] || [ -z "$EMAILJS_TEMPLATE_ID" ] || [ -z "$EMAILJS_PUBLIC_KEY" ]; then
            echo "❌ EmailJS secrets are EMPTY"
            exit 1
          else
            echo "✅ EmailJS secrets are available"
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
