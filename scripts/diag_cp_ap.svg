<svg viewBox="0 0 780 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t{font-weight:700;font-size:15px;font-family:Segoe UI,sans-serif}
      .tx{font-size:12px;font-family:Segoe UI,sans-serif}
      .sb{font-size:11px;font-family:Segoe UI,sans-serif;fill:#555}
      .bg{font-weight:700;font-size:14px;font-family:Segoe UI,sans-serif}
      .lr{fill:#d32f2f;font-weight:600;font-size:12px;font-family:Segoe UI,sans-serif}
      .lg{fill:#2e7d32;font-weight:600;font-size:12px;font-family:Segoe UI,sans-serif}
      .sc{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5;rx:10}
      .sa{fill:#fff3e0;stroke:#f57c00;stroke-width:1.5;rx:10}
    </style>
    <marker id="aok" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect x="30" y="30" width="350" height="390" rx="14" fill="#fff8f8" stroke="#c2410c" stroke-width="2"/>
  <rect x="30" y="30" width="350" height="50" fill="#c2410c" rx="14"/>
  <text x="205" y="60" text-anchor="middle" class="bg" fill="white">C+P = CP Systems</text>
  <text x="205" y="90" text-anchor="middle" class="sb" fill="#c2410c">Consistency + Partition Tolerance</text>
  <text x="205" y="112" text-anchor="middle" class="sb">Sacrifice: Availability during partition</text>
  <rect x="55" y="135" width="130" height="60" class="sc"/>
  <text x="120" y="158" text-anchor="middle" class="tx" font-weight="600">Client writes</text>
  <text x="120" y="176" text-anchor="middle" class="sb">data to Node A</text>
  <line x1="185" y1="165" x2="225" y2="165" stroke="#302b63" stroke-width="1.8" marker-end="url(#aok)"/>
  <text x="205" y="158" text-anchor="middle" class="lg">replicates</text>
  <rect x="225" y="135" width="130" height="60" class="sc"/>
  <text x="290" y="158" text-anchor="middle" class="tx" font-weight="600">Node B</text>
  <text x="290" y="176" text-anchor="middle" class="sb">gets data too</text>
  <line x1="55" y1="220" x2="345" y2="220" stroke="#d32f2f" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="200" y="240" text-anchor="middle" class="lr">NETWORK PARTITION (A-B disconnected)</text>
  <rect x="55" y="260" width="130" height="70" class="sc"/>
  <text x="120" y="282" text-anchor="middle" class="tx" font-weight="600">Client writes</text>
  <text x="120" y="298" text-anchor="middle" class="sb">to Node A</text>
  <text x="120" y="314" text-anchor="middle" class="lg" fill="#2e7d32">Accepted (A is leader)</text>
  <line x1="185" y1="295" x2="225" y2="295" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="205" y="288" text-anchor="middle" class="lr">cannot reach B</text>
  <rect x="225" y="260" width="130" height="70" fill="#fff5f5" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="5,3" rx="10"/>
  <text x="290" y="282" text-anchor="middle" class="lr">Node B</text>
  <text x="290" y="298" text-anchor="middle" class="lr">returns ERROR</text>
  <text x="290" y="314" text-anchor="middle" class="sb" fill="#d32f2f">(not available)</text>
  <rect x="50" y="355" width="295" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="10"/>
  <text x="198" y="376" text-anchor="middle" class="lg">Data consistent - some requests fail</text>
  <text x="198" y="396" text-anchor="middle" class="sb" fill="#2e7d32">DB: MongoDB, HBase, Redis, ZooKeeper</text>
  <rect x="400" y="30" width="350" height="390" rx="14" fill="#f0faf0" stroke="#15803d" stroke-width="2"/>
  <rect x="400" y="30" width="350" height="50" fill="#15803d" rx="14"/>
  <text x="575" y="60" text-anchor="middle" class="bg" fill="white">A+P = AP Systems</text>
  <text x="575" y="90" text-anchor="middle" class="sb" fill="#15803d">Availability + Partition Tolerance</text>
  <text x="575" y="112" text-anchor="middle" class="sb">Sacrifice: Consistency during partition</text>
  <rect x="425" y="135" width="130" height="60" class="sa"/>
  <text x="490" y="158" text-anchor="middle" class="tx" font-weight="600">Client writes</text>
  <text x="490" y="176" text-anchor="middle" class="sb">data to Node A</text>
  <line x1="555" y1="165" x2="595" y2="165" stroke="#302b63" stroke-width="1.8" marker-end="url(#aok)"/>
  <text x="575" y="158" text-anchor="middle" class="lg">replicates (async)</text>
  <rect x="595" y="135" width="130" height="60" class="sa"/>
  <text x="660" y="158" text-anchor="middle" class="tx" font-weight="600">Node B</text>
  <text x="660" y="176" text-anchor="middle" class="sb">gets data soon</text>
  <line x1="425" y1="220" x2="745" y2="220" stroke="#d32f2f" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="585" y="240" text-anchor="middle" class="lr">NETWORK PARTITION (A-B disconnected)</text>
  <rect x="425" y="260" width="130" height="70" class="sa"/>
  <text x="490" y="282" text-anchor="middle" class="tx" font-weight="600">Client writes</text>
  <text x="490" y="298" text-anchor="middle" class="sb">to Node A</text>
  <text x="490" y="314" text-anchor="middle" class="lg" fill="#2e7d32">Accepted</text>
  <line x1="555" y1="295" x2="595" y2="295" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="575" y="288" text-anchor="middle" class="lr">cannot reach B</text>
  <rect x="595" y="260" width="130" height="70" class="sa"/>
  <text x="660" y="282" text-anchor="middle" class="tx" font-weight="600">Client reads</text>
  <text x="660" y="298" text-anchor="middle" class="sb">from Node B</text>
  <text x="660" y="314" text-anchor="middle" class="lg" fill="#2e7d32">Returns data (stale)</text>
  <rect x="420" y="355" width="295" height="55" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5" rx="10"/>
  <text x="568" y="376" text-anchor="middle" class="lg" fill="#e65100">All requests succeed - data may be stale</text>
  <text x="568" y="396" text-anchor="middle" class="sb" fill="#e65100">DB: Cassandra, DynamoDB, CouchDB</text>
</svg>