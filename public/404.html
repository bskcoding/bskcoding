<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BSK CODING</title>
    <script>
      // Redirect all 404s to index.html for React Router
      // Custom domain (bskcoding.com) serves from root
      window.location.replace(
        window.location.protocol +
          "//" +
          window.location.host +
          "/index.html?path=" +
          encodeURIComponent(window.location.pathname),
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
