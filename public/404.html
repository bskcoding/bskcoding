<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BSK CODING</title>
    <script>
      // Redirect all paths to index.html for React Router
      // This allows BrowserRouter to work on GitHub Pages
      const path = window.location.pathname;

      // Get the base path from the current path
      // Matches /bskcoding/... or just /
      if (path.startsWith("/bskcoding")) {
        window.location.href = "/bskcoding/index.html";
      } else {
        window.location.href = "/index.html";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
